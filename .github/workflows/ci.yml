name: CI

# Build + tests à chaque push et pull request, pour que les régressions (sur `core` comme sur
# les parcours critiques de `app` désormais couverts par TestFX) soient détectées avant la revue
# plutôt que par discipline manuelle.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Installer Xvfb (écran virtuel pour les tests TestFX de app)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Compiler et tester
        run: xvfb-run -a mvn -B verify
